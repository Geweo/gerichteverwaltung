# Supabase lokale Entwicklung – nur für Local (supabase start)
# Dev/Prod: Supabase Cloud; diese Config wird dort nicht verwendet.

project_id = "ernaehrbar-local"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:3000", "https://localhost:5173"]
jwt_expiry = 3600

[auth.email]
enable_signup = true

[storage]
enabled = true
# Lokal: PDF-Upload primär über LocalStack S3; Supabase Storage optional

[realtime]
enabled = true
